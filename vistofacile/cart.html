<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrello — VistoFacile.it</title><style>:root{--bg:#f5f3ee;--ink:#111;--muted:#6d6a64;--line:#ddd8cf}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:1000px;margin:auto;padding:28px 22px 70px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:950;letter-spacing:-.05em}.brand b{font-weight:450}.navlinks{display:flex;gap:14px;font-weight:750;font-size:14px}.box{margin-top:34px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px}h1{font-size:48px;letter-spacing:-.05em;margin:0 0 8px}.muted{color:var(--muted)}.item{display:grid;grid-template-columns:1fr auto auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid #eee}.item h3{margin:0 0 5px;font-size:20px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid #bbb;background:#fff;font-weight:900;cursor:pointer}.price{font-weight:950}.remove{border:0;background:transparent;text-decoration:underline;cursor:pointer}.total{display:flex;justify-content:space-between;align-items:center;padding:24px 0 0;font-size:24px;font-weight:950}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #111;border-radius:999px;padding:14px 20px;background:#111;color:#fff;font-weight:900}.btn.light{background:#fff;color:#111}.empty{text-align:center;padding:50px 20px}.empty h2{font-size:30px;margin-bottom:8px}@media(max-width:700px){.item{grid-template-columns:1fr auto}.item .qty{grid-column:1}.item .remove{grid-column:2}.box{padding:24px}h1{font-size:40px}}</style><script src="store.js" defer></script></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html">Visto<b>Facile.it</b></a><div class="navlinks"><a href="shop.html">Servizi</a><a href="area-clienti.html">Area cliente</a></div></nav><div class="box"><h1>Il tuo carrello</h1><p class="muted">Controlla i servizi selezionati prima di procedere.</p><div id="cart"></div></div></div><script>function renderCart(){const c=vfGetCart(),el=document.getElementById('cart');if(!c.length){el.innerHTML='<div class="empty"><h2>Il carrello è vuoto.</h2><p class="muted">Scegli il livello di assistenza più adatto al tuo viaggio.</p><a class="btn" href="shop.html">Vedi i servizi</a></div>';return}el.innerHTML=c.map(x=>{const p=VF_PRODUCTS[x.id];return `<div class="item"><div><h3>${p.name}</h3><div class="muted">${p.short}</div></div><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><strong>${x.qty}</strong><button onclick="changeQty('${x.id}',1)">+</button></div><div class="price">${vfMoney(p.price*x.qty)}</div><button class="remove" onclick="vfRemoveFromCart('${x.id}');renderCart()">Rimuovi</button></div>`}).join('')+`<div class="total"><span>Totale servizi</span><span>${vfMoney(vfCartTotal())}</span></div><div class="actions"><a class="btn light" href="shop.html">Continua gli acquisti</a><a class="btn" href="checkout.html">Vai al checkout</a></div>`}function changeQty(id,d){const c=vfGetCart(),i=c.findIndex(x=>x.id===id);if(i>=0)vfSetQty(id,c[i].qty+d);renderCart()}window.addEventListener('DOMContentLoaded',renderCart)</script></body></html>
