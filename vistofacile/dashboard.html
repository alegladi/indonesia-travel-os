<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — VistoFacile</title><style>:root{--bg:#f6f7f5;--ink:#15211d;--muted:#66716d;--accent:#ef5b36;--green:#153f36;--line:#e2e5e1}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--green);color:#fff;padding:26px 20px}.brand{font-size:22px;font-weight:900}.brand b{color:#ff8b6d}.menu{margin-top:35px;display:grid;gap:8px}.menu a{padding:12px;border-radius:10px;color:#dce8e3}.menu a.active{background:#234f45;color:white}.main{padding:30px}.top{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat strong{font-size:30px;display:block}.table{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.row{display:grid;grid-template-columns:1.3fr 1.3fr 1fr .8fr .8fr;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);align-items:center}.row.head{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#f1eee6;font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}.btn{background:var(--accent);color:#fff;padding:11px 15px;border-radius:99px;text-decoration:none;font-weight:800;font-size:13px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.hide-sm{display:none}}</style></head><body><div class="layout"><aside class="side"><div class="brand">Visto<b>Facile</b></div><div class="menu"><a class="active" href="dashboard.html">Richieste</a><a href="index.html">Sito pubblico</a><a href="richiesta.html">Nuova richiesta</a></div></aside><main class="main"><div class="top"><div><h1 style="margin:0">Richieste clienti</h1><p style="color:var(--muted)">Tutto quello che serve per sapere chi seguire e cosa fare.</p></div><a class="btn" href="richiesta.html">+ Nuovo contatto</a></div><div class="stats"><div class="stat"><span>Contatti</span><strong id="s1">0</strong></div><div class="stat"><span>Da contattare</span><strong id="s2">0</strong></div><div class="stat"><span>Valore richieste</span><strong id="s3">€0</strong></div><div class="stat"><span>Call registrate</span><strong id="s4">0</strong></div></div><div class="table"><div class="row head"><div>Cliente</div><div>Viaggio</div><div>Servizio</div><div class="hide-sm">Stato</div><div></div></div><div id="rows"></div></div></main></div><script>const leads=JSON.parse(localStorage.getItem('vf_leads')||'[]');document.getElementById('s1').textContent=leads.length;document.getElementById('s2').textContent=leads.filter(x=>x.stato==='Nuovo').length;document.getElementById('s3').textContent='€'+leads.reduce((a,b)=>a+(+b.valore||0),0);document.getElementById('s4').textContent=leads.reduce((a,b)=>a+(b.call?.length||0),0);const rows=document.getElementById('rows');if(!leads.length){rows.innerHTML='<div class="empty">Nessuna richiesta ancora. Compila il modulo di prova per vedere il flusso.</div>'}else rows.innerHTML=leads.map(x=>`<div class="row"><div><strong>${x.nome||'-'}</strong><br><small>${x.email||''}</small></div><div>${x.destinazioni||'-'}<br><small>${x.partenza||''}</small></div><div>${x.servizio||'-'}</div><div class="hide-sm"><span class="pill">${x.stato}</span></div><div><a class="btn" href="scheda.html?id=${x.id}">Apri</a></div></div>`).join('')</script></body></html>
