<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheda cliente — VistoFacile</title><style>:root{--bg:#f5f3ee;--ink:#111;--muted:#6e6c66;--line:#dedbd3}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:28px 22px}.back{display:inline-block;color:var(--muted);font-weight:750;margin-bottom:18px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.head h1{font-size:40px;letter-spacing:-.05em;margin:0 0 7px}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}.card h2{font-size:20px;margin:0 0 16px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fact span{font-size:11px;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.fact strong{display:block;margin-top:4px;font-size:15px;word-break:break-word}.fieldlabel{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}textarea{min-height:115px;resize:vertical}.btn{border:1px solid #111;background:#111;color:white;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:#111}.pill{padding:7px 11px;border-radius:99px;background:#efece6;font-size:12px;font-weight:800}.money{font-size:38px;font-weight:950;letter-spacing:-.05em;margin-top:5px}.log{padding:12px 0;border-bottom:1px solid #eeeae3}.log small{color:var(--muted)}.todo{list-style:none;padding:0;margin:0}.todo li{padding:10px 0;border-bottom:1px solid #eeeae3}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:820px){.grid{grid-template-columns:1fr}.facts,.row2{grid-template-columns:1fr}.head{flex-direction:column}}</style></head><body><div class="wrap"><a class="back" href="dashboard.html">Torna alla dashboard</a><div class="head"><div><h1 id="name">Cliente</h1><div id="contact" class="sub"></div></div><div><span class="pill" id="status"></span></div></div><div class="grid"><div><div class="card"><h2>Informazioni dal modulo</h2><div class="facts" id="facts"></div></div><div class="card"><h2>Note interne</h2><textarea id="internalNotes" placeholder="Scrivi qui tutte le informazioni utili sul cliente e sulla pratica..."></textarea><button class="btn" onclick="saveInternalNotes()" style="margin-top:10px">Salva note</button></div><div class="card"><h2>Storico contatti</h2><div id="calls"></div><label class="fieldlabel">Data e ora</label><input id="callDate" type="datetime-local"><label class="fieldlabel">Nota contatto</label><textarea id="callNote" placeholder="Esito della call, cosa è stato deciso, cosa deve inviare il cliente..."></textarea><button class="btn" onclick="addCall()" style="margin-top:10px">Registra contatto</button></div><div class="card"><h2>Attività da fare</h2><ul class="todo" id="todo"></ul><input id="newTodo" placeholder="Aggiungi attività" style="margin-top:10px"><button class="btn" onclick="addTodo()" style="margin-top:10px">Aggiungi attività</button></div></div><div><div class="card"><h2>Gestione cliente</h2><label class="fieldlabel">Stato</label><select id="state" onchange="saveManagement()"><option>Nuovo</option><option>Da contattare</option><option>Call fissata</option><option>In lavorazione</option><option>In attesa cliente</option><option>Completato</option><option>Perso</option></select><label class="fieldlabel">Responsabile</label><input id="owner" placeholder="Nome responsabile" onchange="saveManagement()"><label class="fieldlabel">Prossima azione</label><input id="nextAction" placeholder="Es. chiamare cliente" onchange="saveManagement()"><label class="fieldlabel">Data prossima azione</label><input id="nextDate" type="date" onchange="saveManagement()"></div><div class="card"><h2>Servizio e ricavi</h2><label class="fieldlabel">Servizio scelto</label><select id="service" onchange="serviceChanged()"><option value="">Da definire</option><option>Check Viaggio</option><option>Guida 1:1</option><option>Fatto per Te</option><option>No Pensieri</option><option>Altro</option></select><label class="fieldlabel">Valore servizio</label><input id="value" type="number" min="0" step="1" onchange="saveMoney()"><div class="row2"><div><label class="fieldlabel">Pagamento</label><select id="payment" onchange="saveMoney()"><option>Da pagare</option><option>Pagato</option></select></div><div><label class="fieldlabel">Data pagamento</label><input id="paymentDate" type="date" onchange="saveMoney()"></div></div><label class="fieldlabel">Metodo di pagamento</label><select id="paymentMethod" onchange="saveMoney()"><option value="">Non indicato</option><option>Carta</option><option>Bonifico</option><option>PayPal</option><option>Contanti</option><option>Altro</option></select><div style="margin-top:18px"><span class="sub">Valore cliente</span><div class="money" id="bigValue">€0</div></div></div><div class="card"><h2>Scadenze</h2><div id="deadlines"></div><input id="deadDate" type="date"><input id="deadText" placeholder="Es. richiedere copia passaporto" style="margin-top:8px"><button class="btn" onclick="addDeadline()" style="margin-top:10px">Aggiungi scadenza</button></div><div class="card"><h2>Documenti</h2><textarea id="docs" placeholder="Elenca documenti ricevuti, mancanti o da verificare..." onchange="saveDocs()"></textarea></div></div></div></div><script>const id=new URLSearchParams(location.search).get('id');let leads=JSON.parse(localStorage.getItem('vf_leads')||'[]');let i=leads.findIndex(x=>x.id===id);if(i<0)location.href='dashboard.html';let x=leads[i];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function persist(){leads[i]=x;localStorage.setItem('vf_leads',JSON.stringify(leads));render()}function render(){document.getElementById('name').textContent=x.nome||'Cliente';document.getElementById('contact').textContent=[x.email,x.telefono,'ID '+x.id].filter(Boolean).join(' · ');document.getElementById('status').textContent=x.stato||'Nuovo';const fields=[['Email',x.email],['Telefono / WhatsApp',x.telefono],['Paese di partenza',x.paesePartenza],['Passaporto',x.passaporto],['Destinazioni',x.destinazioni],['Data di partenza',x.partenza],['Durata',x.durata],['Tipo di viaggio',x.tipoViaggio],['Numero persone',x.persone],['Minori',x.minori],['Cosa vorrebbe da noi',x.desiderio],['Preoccupazioni',x.problema],['Note inviate dal cliente',x.note],['Richiesta ricevuta',x.creato?new Date(x.creato).toLocaleString('it-IT'):'']];document.getElementById('facts').innerHTML=fields.map(([a,b])=>`<div class="fact"><span>${esc(a)}</span><strong>${esc(b||'-')}</strong></div>`).join('');document.getElementById('internalNotes').value=x.noteInterne||'';document.getElementById('todo').innerHTML=(x.todo||[]).map((t,n)=>`<li><label><input type="checkbox" onchange="doneTodo(${n})" style="width:auto;margin-right:8px">${esc(t)}</label></li>`).join('');document.getElementById('calls').innerHTML=(x.call||[]).map(c=>`<div class="log"><strong>${esc(c.data||'')}</strong><br>${esc(c.note||'')}</div>`).join('')||'<p class="sub">Nessun contatto registrato.</p>';document.getElementById('deadlines').innerHTML=(x.scadenze||[]).map(d=>`<div class="log"><strong>${esc(d.data||'')}</strong><br>${esc(d.testo||'')}</div>`).join('')||'<p class="sub">Nessuna scadenza.</p>';document.getElementById('state').value=x.stato||'Nuovo';document.getElementById('owner').value=x.responsabile||'';document.getElementById('nextAction').value=x.prossimaAzione||'';document.getElementById('nextDate').value=x.dataProssimaAzione||'';document.getElementById('service').value=['Check Viaggio','Guida 1:1','Fatto per Te','No Pensieri','Altro'].includes(x.servizio)?x.servizio:'';document.getElementById('value').value=Number(x.valore)||'';document.getElementById('payment').value=x.pagamento||'Da pagare';document.getElementById('paymentDate').value=x.dataPagamento||'';document.getElementById('paymentMethod').value=x.metodoPagamento||'';document.getElementById('bigValue').textContent=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(x.valore)||0);document.getElementById('docs').value=x.docs||''}function addTodo(){if(newTodo.value.trim()){x.todo=x.todo||[];x.todo.push(newTodo.value.trim());newTodo.value='';persist()}}function doneTodo(n){x.todo.splice(n,1);persist()}function addCall(){if(callDate.value||callNote.value.trim()){x.call=x.call||[];x.call.unshift({data:callDate.value||new Date().toLocaleString('it-IT'),note:callNote.value.trim()});callDate.value='';callNote.value='';persist()}}function addDeadline(){if(deadDate.value||deadText.value.trim()){x.scadenze=x.scadenze||[];x.scadenze.push({data:deadDate.value,testo:deadText.value.trim()});deadDate.value='';deadText.value='';persist()}}function saveInternalNotes(){x.noteInterne=internalNotes.value;persist()}function saveManagement(){x.stato=state.value;x.responsabile=owner.value;x.prossimaAzione=nextAction.value;x.dataProssimaAzione=nextDate.value;persist()}function serviceChanged(){const defaults={'Check Viaggio':19,'Guida 1:1':49,'Fatto per Te':79,'No Pensieri':249};x.servizio=service.value||'Da definire';if(defaults[service.value]&&!value.value)x.valore=defaults[service.value];else x.valore=Number(value.value)||0;persist()}function saveMoney(){x.servizio=service.value||'Da definire';x.valore=Number(value.value)||0;x.pagamento=payment.value;x.dataPagamento=paymentDate.value;x.metodoPagamento=paymentMethod.value;persist()}function saveDocs(){x.docs=docs.value;persist()}render()</script></body></html>
