<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheda cliente — VistoFacile</title><style>:root{--bg:#f6f7f5;--ink:#15211d;--muted:#66716d;--accent:#ef5b36;--green:#153f36;--line:#e2e5e1}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:28px 22px}.back{text-decoration:none;color:var(--muted)}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin:20px 0}.pill{padding:7px 11px;border-radius:99px;background:#efece4;font-size:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fact span{font-size:12px;color:var(--muted);display:block}.fact strong{display:block;margin-top:3px}.todo{list-style:none;padding:0}.todo li{padding:10px 0;border-bottom:1px solid var(--line)}input,textarea,select{width:100%;padding:12px;border:1px solid #d7ddd9;border-radius:10px;font:inherit;margin-top:8px}.btn{border:0;background:var(--accent);color:white;border-radius:99px;padding:11px 16px;font-weight:800;cursor:pointer}.log{padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="dashboard.html">← Torna alla dashboard</a><div class="head"><div><h1 id="name" style="margin-bottom:4px"></h1><div id="contact" style="color:var(--muted)"></div></div><span class="pill" id="status"></span></div><div class="grid"><div><div class="card"><h2>Viaggio e richiesta</h2><div class="facts" id="facts"></div><h3>Problema / aspettative</h3><p id="problem"></p><h3>Note</h3><p id="notes"></p></div><div class="card"><h2>Attività da fare</h2><ul class="todo" id="todo"></ul><input id="newTodo" placeholder="Aggiungi attività"><button class="btn" onclick="addTodo()" style="margin-top:10px">Aggiungi</button></div><div class="card"><h2>Call e contatti</h2><div id="calls"></div><input id="callDate" type="datetime-local"><textarea id="callNote" placeholder="Esito call, cosa è stato deciso, prossimi passi..."></textarea><button class="btn" onclick="addCall()">Registra call</button></div></div><div><div class="card"><h2>Gestione</h2><label>Stato</label><select id="state" onchange="saveState()"><option>Nuovo</option><option>Da contattare</option><option>Call fissata</option><option>In lavorazione</option><option>In attesa documenti</option><option>Completato</option><option>Perso</option></select><label>Valore economico €</label><input id="value" type="number" onchange="saveValue()"><h3>Guadagno previsto</h3><div style="font-size:40px;font-weight:900" id="bigValue"></div></div><div class="card"><h2>Scadenze</h2><div id="deadlines"></div><input id="deadDate" type="date"><input id="deadText" placeholder="Es. richiedere passaporto"><button class="btn" onclick="addDeadline()" style="margin-top:10px">Aggiungi scadenza</button></div><div class="card"><h2>Documenti</h2><p style="color:var(--muted)">Nel prototipo registriamo cosa manca. Nella versione con backend questa sezione diventa upload reale e sicuro.</p><textarea id="docs" placeholder="Es. passaporto, foto tessera, prenotazione..." onchange="saveDocs()"></textarea></div></div></div></div><script>const id=new URLSearchParams(location.search).get('id');let leads=JSON.parse(localStorage.getItem('vf_leads')||'[]');let i=leads.findIndex(x=>x.id===id);if(i<0){location.href='dashboard.html'}let x=leads[i];function persist(){leads[i]=x;localStorage.setItem('vf_leads',JSON.stringify(leads));render()}function render(){name.textContent=x.nome||'Cliente';contact.textContent=(x.email||'')+' · '+(x.telefono||'');status.textContent=x.stato;facts.innerHTML=`<div class="fact"><span>Destinazioni</span><strong>${x.destinazioni||'-'}</strong></div><div class="fact"><span>Partenza</span><strong>${x.partenza||'-'}</strong></div><div class="fact"><span>Durata</span><strong>${x.durata||'-'}</strong></div><div class="fact"><span>Passaporto</span><strong>${x.passaporto||'-'}</strong></div><div class="fact"><span>Stile</span><strong>${x.stile||'-'}</strong></div><div class="fact"><span>Servizio</span><strong>${x.servizio||'-'}</strong></div>`;problem.textContent=x.problema||'-';notes.textContent=x.note||'-';todo.innerHTML=(x.todo||[]).map((t,n)=>`<li><label><input type="checkbox" onchange="doneTodo(${n})" style="width:auto;margin-right:8px">${t}</label></li>`).join('');calls.innerHTML=(x.call||[]).map(c=>`<div class="log"><strong>${c.data}</strong><br>${c.note}</div>`).join('')||'<p style="color:var(--muted)">Nessuna call registrata.</p>';deadlines.innerHTML=(x.scadenze||[]).map(d=>`<div class="log"><strong>${d.data}</strong><br>${d.testo}</div>`).join('')||'<p style="color:var(--muted)">Nessuna scadenza.</p>';state.value=x.stato||'Nuovo';value.value=x.valore||0;bigValue.textContent='€'+(x.valore||0);docs.value=x.docs||''}function addTodo(){if(newTodo.value){x.todo.push(newTodo.value);newTodo.value='';persist()}}function doneTodo(n){x.todo.splice(n,1);persist()}function addCall(){if(callDate.value||callNote.value){x.call=x.call||[];x.call.unshift({data:callDate.value||new Date().toLocaleString(),note:callNote.value});callDate.value='';callNote.value='';persist()}}function addDeadline(){if(deadDate.value||deadText.value){x.scadenze=x.scadenze||[];x.scadenze.push({data:deadDate.value,testo:deadText.value});deadDate.value='';deadText.value='';persist()}}function saveState(){x.stato=state.value;persist()}function saveValue(){x.valore=+value.value;persist()}function saveDocs(){x.docs=docs.value;persist()}render()</script></body></html>
